<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hook Tracker</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif;font-weight:700}main{height:100dvh;max-width:430px;margin:auto;padding:5px 6px;display:grid;grid-template-rows:auto auto 1fr auto;gap:3px}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #777;padding:0 1px 3px}h1{margin:0;font-size:20px;line-height:22px;letter-spacing:.2px}#d{color:#ddd;font-size:12px;line-height:16px;text-align:right;white-space:nowrap}label{display:flex;align-items:center;gap:6px;color:#ddd;font-size:12px;line-height:22px}select{flex:1;min-width:0;height:24px;border:2px solid #aaa;border-radius:3px;background:#111;color:#fff;font:700 12px Arial}.rows{min-height:0;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:3px}.row{display:grid;grid-template-columns:minmax(0,1fr) 34px 38px 34px;gap:3px;min-height:0}.name,.count,button{border-radius:4px;min-height:0}.name{display:flex;align-items:center;background:#111;border:2px solid #aaa;padding:0 6px;font-size:14px;overflow:hidden;white-space:nowrap}.count{display:flex;align-items:center;justify-content:center;background:#fff;color:#000;font-size:20px;font-variant-numeric:tabular-nums}button{border:2px solid #fff;background:#ffcc00;color:#000;font:900 23px Arial;line-height:1;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid #00e5ff;outline-offset:1px}button:disabled{background:#272727;border-color:#555;color:#888}footer{border-top:2px solid #777;padding-top:3px}#reset{width:100%;height:25px;background:#000;color:#ff7777;border-color:#ff7777;font-size:13px;letter-spacing:.2px}#reset:disabled{color:#888;border-color:#555}@media(max-width:220px){.row{grid-template-columns:minmax(0,1fr) 30px 34px 30px}.name{font-size:12px}}
</style>
<main>
  <header><h1>Hook Tracker</h1><div id="d"></div></header>
  <label for="day">Review <select id="day" aria-label="Review a day"></select></label>
  <section id="rows" class="rows" aria-label="Hook counts"></section>
  <footer><button id="reset">Reset today</button></footer>
</main>
<script>
(()=>{
  const B=['Gibson','Epiphone','Ibanez','Fender','Squier','Basses','PRS'];
  const P='hook-tracker:', R=document.getElementById('rows'), D=document.getElementById('d'), S=document.getElementById('day'), Z=document.getElementById('reset');
  const T=()=>new Date().toLocaleDateString('en-CA');
  const L=x=>new Date(x+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const G=x=>{try{const v=JSON.parse(localStorage.getItem(P+x));return Object.fromEntries(B.map(b=>[b,Number.isSafeInteger(v?.[b])&&v[b]>=0?v[b]:0]));}catch{return Object.fromEntries(B.map(b=>[b,0]));}};
  const W=(x,v)=>localStorage.setItem(P+x,JSON.stringify(v));
  const F=x=>{const q=[T(),...Object.keys(localStorage).filter(k=>k.startsWith(P)).map(k=>k.slice(P.length)).filter(k=>/^\d{4}-\d\d-\d\d$/.test(k))];S.innerHTML='';[...new Set(q)].sort().reverse().forEach(k=>S.add(new Option(k===T()?'Today — '+L(k):L(k),k)));S.value=x;};
  const V=x=>{const e=x===T(),v=G(x);D.textContent=(e?'Today':'Review')+' · '+L(x);R.innerHTML='';B.forEach(b=>{const r=document.createElement('div'),n=document.createElement('div'),m=document.createElement('button'),c=document.createElement('div'),p=document.createElement('button');r.className='row';n.className='name';n.textContent=b;m.textContent='−';m.setAttribute('aria-label','Subtract one '+b);p.textContent='+';p.setAttribute('aria-label','Add one '+b);c.className='count';c.textContent=v[b];c.setAttribute('aria-label',b+' count '+v[b]);m.disabled=!e||v[b]===0;p.disabled=!e;m.onclick=()=>{v[b]--;W(x,v);V(x);};p.onclick=()=>{v[b]++;W(x,v);V(x);};r.append(n,m,c,p);R.append(r);});Z.disabled=!e;Z.textContent=e?'Reset today':'Prior day — read only';};
  S.onchange=()=>V(S.value);
  Z.onclick=()=>{const x=T();W(x,Object.fromEntries(B.map(b=>[b,0])));F(x);V(x);};
  const x=T();F(x);V(x);
})();
</script>
</html>
